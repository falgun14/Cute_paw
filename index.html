<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Companion</title>
<meta name="description" content="A tiny robot companion that lives on your screen.">

<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Companion">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<canvas id="robot-canvas" aria-hidden="true"></canvas>

<!-- Hidden settings panel. Never visible during normal operation - only
     reachable via the long-press-on-the-bottom-edge gesture. -->
<div id="settings-panel" class="settings-panel" aria-hidden="true">
  <div class="settings-card">
    <div class="settings-row settings-title-row">
      <span class="settings-title">Companion settings</span>
      <button id="settings-close" class="icon-btn" type="button" aria-label="Close settings">&#10005;</button>
    </div>

    <label class="settings-row settings-switch">
      <span>Sound</span>
      <input id="toggle-sound" type="checkbox" checked>
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>

    <button id="toggle-motion" class="settings-row settings-btn" type="button">Shake to make dizzy: off</button>
    <button id="toggle-mic" class="settings-row settings-btn" type="button">Listening: off</button>
    <button id="toggle-camera" class="settings-row settings-btn" type="button">Notices when you're near: off</button>
    <button id="toggle-fullscreen" class="settings-row settings-btn" type="button">Toggle fullscreen</button>

    <div class="settings-row settings-slider-row">
      <span>Animation intensity</span>
      <input id="intensity-slider" type="range" min="0.3" max="1" step="0.1" value="1">
    </div>

    <button id="settings-reset" class="settings-row settings-btn settings-reset" type="button">Reset companion</button>

    <p class="settings-hint">Three-finger tap anywhere mutes. Swipe down from the very top edge exits fullscreen. Two-finger double-tap resets. This panel only shows because you held the bottom edge.</p>
  </div>
</div>

<script src="./config.js"></script>
<script src="./audio.js"></script>
<script src="./sensors.js"></script>
<script src="./robot.js"></script>
<script src="./input.js"></script>
<script src="./main.js"></script>
</body>
</html>
